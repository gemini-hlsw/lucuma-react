name: Continuous Integration

on:
  pull_request:
    branches: ['**', '!update/**', '!pr/**', '!dependabot/**']
  push:
    branches: ['**', '!update/**', '!pr/**', '!dependabot/**']
    tags: [v*]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-22.04]
        scala: [3]
        java: [temurin@25]
        project: [rootCore, rootGridLayout, rootDraggable, rootFloatingui, rootTanstackTable, rootHighcharts, rootDatepicker, rootBeautifulDnd, rootPragmaticDnd, rootFontAwesome, rootHotkeys, rootResizable, rootPrimeReact, circularProgressbar, markdown]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm ci --prefer-offline

      - name: Check that workflows are up to date
        run: sbt githubWorkflowCheck

      - name: Check headers and formatting
        if: matrix.java == 'temurin@25' && matrix.os == 'ubuntu-22.04'
        run: sbt '++ ${{ matrix.scala }}' 'project ${{ matrix.project }}' headerCheckAll scalafmtCheckAll 'project /' scalafmtSbtCheck lucumaScalafmtCheck lucumaScalafixCheck lucumaSlackNotifyCheck

      - name: Check scalafix lints
        if: matrix.java == 'temurin@25' && matrix.os == 'ubuntu-22.04'
        run: sbt '++ ${{ matrix.scala }}' 'project ${{ matrix.project }}' 'scalafixAll --check'

      - name: Test affected projects
        run: sbt '++ ${{ matrix.scala }}' 'project ${{ matrix.project }}' lucumaTestAffected

      - name: Check binary compatibility
        if: matrix.java == 'temurin@25' && matrix.os == 'ubuntu-22.04'
        run: sbt '++ ${{ matrix.scala }}' 'project ${{ matrix.project }}' mimaReportBinaryIssues

      - name: Generate API documentation
        if: matrix.java == 'temurin@25' && matrix.os == 'ubuntu-22.04'
        run: sbt '++ ${{ matrix.scala }}' 'project ${{ matrix.project }}' doc

      - name: Make target directories
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        run: mkdir -p floatingui/target test/target circular-progressbar/target prime-react/target highcharts/target tanstack-table/target resize-detector/target resizable/target font-awesome/target hotkeys-hooks/target pragmatic-dnd/target grid-layout/target datepicker/target common/target draggable/target beautiful-dnd/target markdown/target project/target

      - name: Compress target directories
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        run: tar cf targets.tar floatingui/target test/target circular-progressbar/target prime-react/target highcharts/target tanstack-table/target resize-detector/target resizable/target font-awesome/target hotkeys-hooks/target pragmatic-dnd/target grid-layout/target datepicker/target common/target draggable/target beautiful-dnd/target markdown/target project/target

      - name: Upload target directories
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v5
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-${{ matrix.scala }}-${{ matrix.project }}
          path: targets.tar

  publish:
    name: Publish Artifacts
    needs: [build]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Download target directories (3, rootCore)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-rootCore

      - name: Inflate target directories (3, rootCore)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, rootGridLayout)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-rootGridLayout

      - name: Inflate target directories (3, rootGridLayout)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, rootDraggable)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-rootDraggable

      - name: Inflate target directories (3, rootDraggable)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, rootFloatingui)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-rootFloatingui

      - name: Inflate target directories (3, rootFloatingui)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, rootTanstackTable)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-rootTanstackTable

      - name: Inflate target directories (3, rootTanstackTable)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, rootHighcharts)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-rootHighcharts

      - name: Inflate target directories (3, rootHighcharts)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, rootDatepicker)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-rootDatepicker

      - name: Inflate target directories (3, rootDatepicker)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, rootBeautifulDnd)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-rootBeautifulDnd

      - name: Inflate target directories (3, rootBeautifulDnd)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, rootPragmaticDnd)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-rootPragmaticDnd

      - name: Inflate target directories (3, rootPragmaticDnd)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, rootFontAwesome)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-rootFontAwesome

      - name: Inflate target directories (3, rootFontAwesome)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, rootHotkeys)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-rootHotkeys

      - name: Inflate target directories (3, rootHotkeys)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, rootResizable)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-rootResizable

      - name: Inflate target directories (3, rootResizable)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, rootPrimeReact)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-rootPrimeReact

      - name: Inflate target directories (3, rootPrimeReact)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, circularProgressbar)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-circularProgressbar

      - name: Inflate target directories (3, circularProgressbar)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (3, markdown)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-markdown

      - name: Inflate target directories (3, markdown)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Import signing key
        if: env.PGP_SECRET != '' && env.PGP_PASSPHRASE == ''
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: echo $PGP_SECRET | base64 -d -i - | gpg --import

      - name: Import signing key and strip passphrase
        if: env.PGP_SECRET != '' && env.PGP_PASSPHRASE != ''
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          echo "$PGP_SECRET" | base64 -d -i - > /tmp/signing-key.gpg
          echo "$PGP_PASSPHRASE" | gpg --pinentry-mode loopback --passphrase-fd 0 --import /tmp/signing-key.gpg
          (echo "$PGP_PASSPHRASE"; echo; echo) | gpg --command-fd 0 --pinentry-mode loopback --change-passphrase $(gpg --list-secret-keys --with-colons 2> /dev/null | grep '^sec:' | cut --delimiter ':' --fields 5 | tail -n 1)

      - name: Publish
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_CREDENTIAL_HOST: ${{ secrets.SONATYPE_CREDENTIAL_HOST }}
        run: sbt tlCiRelease

  validate-steward:
    name: Validate Steward Config
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (fast)
        uses: actions/checkout@v6

      - name: Setup Java (temurin@17)
        id: setup-java-temurin-17
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: coursier/setup-action@v1
        with:
          apps: scala-steward

      - run: scala-steward validate-repo-config .scala-steward.conf

  required-checks:
    name: REQUIRED CHECKS FOR BRANCH PROTECTION - AGGREGATED
    needs: [build]
    if: always()
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Fail if a required job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a required job did not pass"
          exit 1

      - name: Report success
        run: echo "all of build passed or were skipped"
